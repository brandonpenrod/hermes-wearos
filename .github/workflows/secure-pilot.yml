name: Secure pilot verification
on:
  push:
    branches: [harden/secure-pilot]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '8.13'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: tailnet/go/go.mod
          cache-dependency-path: tailnet/go/go.sum
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build dependencies
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
      - name: Rebuild native tailnet library from pinned sources
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20261011034528-197770444867
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20261011034528-197770444867
          cd tailnet/go
          go mod verify
          go vet ./...
          gomobile init
          gomobile bind -v -trimpath -tags=version_android -ldflags='-s -w' -target=android/arm,android/amd64 -androidapi=30 -o ../../app/libs/hermes-tailnet.aar .
      - name: Host security regression tests
        run: |
          python3 -m unittest discover -s app/security-tests -p 'test_*.py' -v
          if [ -d server/watchkit/test ]; then node --test server/watchkit/test/*.test.mjs; fi
      - name: JVM tests and non-debuggable release build
        run: gradle --no-daemon --max-workers=2 testDebugUnitTest assembleRelease
      - name: Sign disposable pilot APK and record provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pilot-artifact
          KS_PASS="$(openssl rand -hex 24)"
          export KS_PASS
          keytool -genkeypair -keystore "$RUNNER_TEMP/pilot.jks" -storepass:env KS_PASS -keypass:env KS_PASS -alias pilot -keyalg RSA -keysize 3072 -validity 30 -dname 'CN=Hermes Wear OS Disposable Pilot'
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/pilot.jks" --ks-key-alias pilot --ks-pass env:KS_PASS --key-pass env:KS_PASS --out pilot-artifact/hermes-wearos-pilot.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --verbose --print-certs pilot-artifact/hermes-wearos-pilot.apk > pilot-artifact/signing-verification.txt
          "$BT/aapt" dump badging pilot-artifact/hermes-wearos-pilot.apk > pilot-artifact/apk-badging.txt
          if grep -q application-debuggable pilot-artifact/apk-badging.txt; then echo 'Refusing debuggable APK'; exit 1; fi
          git rev-parse HEAD > pilot-artifact/SOURCE_REVISION.txt
          git rev-parse HEAD:tailnet/go > pilot-artifact/TAILNET_SOURCE_TREE.txt
          (cd pilot-artifact && sha256sum hermes-wearos-pilot.apk > SHA256SUMS)
          printf '%s\n' 'DISPOSABLE TEST SIGNING KEY: a later build may require uninstall/reinstall, deleting app data. Do not install until README-HARDENED.md test gates are met. Not independently certified or tested on a Galaxy Watch7.' > pilot-artifact/TEST-ONLY.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hermes-wearos-secure-pilot
          path: pilot-artifact/
          retention-days: 14
